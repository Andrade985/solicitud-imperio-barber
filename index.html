<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solicitud de Cita - ImperioBarber</title>
  <link rel="stylesheet" href="css/formulario.css">
</head>
<body>
  <div class="container">
    <h2>Solicitud de Cita — ImperioBarber</h2>
    <p class="subtitulo">Proyecto Integrador: Gestión de Citas para la Barbería ImperioBarber</p>

    <form action="" method="get" class="form-container" id="solicitudForm">

      <div class="form-group">
        <label for="nombre">Nombre completo:</label>
        <input type="text" id="nombre" placeholder="Ingrese su nombre completo"
               required minlength="3" maxlength="40">
      </div>

      <div class="form-group">
        <label for="telefono">Teléfono de contacto:</label>
        <input type="text" id="telefono" placeholder="Ej: 3001234567"
               required pattern="[0-9]{7,10}">
      </div>

      <div class="form-group">
        <label for="correo">Correo electrónico:</label>
        <input type="email" id="correo" placeholder="ejemplo@correo.com" required>
      </div>

      <div class="form-group">
        <label for="barbero">Barbero preferido:</label>
        <select id="barbero" required>
          <option value="">Seleccione un barbero</option>
          <option value="cualquiera">Sin preferencia</option>
          <option value="darwin">Darwin Cardona</option>
          <option value="edwin">Edwin Garcia</option>
          <option value="juan">Juan Esteban Muñoz</option>
        </select>
      </div>

      <div class="form-group">
        <label for="servicio">Servicio solicitado:</label>
        <select id="servicio" required>
          <option value="">Seleccione un servicio</option>
          <option value="corte">Corte de cabello</option>
          <option value="barba">Arreglo de barba</option>
          <option value="corte_barba">Corte + Barba</option>
          <option value="diseno">Diseño / Línea de cabello</option>
          <option value="otros">Otros</option>
        </select>
      </div>

      <div class="form-group">
        <label for="fecha">Fecha deseada:</label>
        <input type="date" id="fecha" required>
      </div>

      <div class="form-group">
        <label for="hora">Hora deseada:</label>
        <input type="time" id="hora" required>
      </div>

      <div class="form-group full-width">
        <label for="comentarios">Comentarios adicionales:</label>
        <textarea id="comentarios" placeholder="Indique alguna preferencia u observación (opcional)"
                  maxlength="200"></textarea>
      </div>

      <div class="button-container">
        <button id="btnEnviar" type="submit">Enviar Solicitud</button>
      </div>

    </form>

    <h3 class="lista-titulo">Solicitudes registradas</h3>
    <div id="listaSolicitudes" class="lista-solicitudes"></div>
  </div>

  <script src="js/formulario.js"></script>
</body>
</html>
